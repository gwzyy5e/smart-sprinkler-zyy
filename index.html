<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Sprinkler - Noir Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0d0d0d; 
            color: #e0e0e0; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            width: 100%; 
            max-width: 420px; 
            background: #141414; 
            border: 2px solid #333333; 
            border-radius: 4px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
        }
        h1 { 
            text-align: center; 
            font-family: 'Special Elite', cursive; 
            font-size: 24px; 
            color: #ffffff; 
            margin-bottom: 25px; 
            letter-spacing: 2px;
            border-bottom: 1px dashed #444;
            padding-bottom: 15px;
        }
        .card { 
            background: #1a1a1a; 
            border: 1px solid #2a2a2a; 
            border-radius: 3px; 
            padding: 18px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .label { 
            font-size: 13px; 
            color: #888888; 
            font-weight: 600;
            letter-spacing: 1px;
        }
        .value { 
            font-size: 22px; 
            font-weight: 600; 
            color: #ffffff; 
        }
        .status-box { 
            text-align: center; 
            padding: 14px; 
            border-radius: 3px; 
            font-weight: 600; 
            font-size: 14px; 
            margin-top: 20px; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
        }
        .off { 
            background: #1a1a1a; 
            color: #777777; 
            border: 1px solid #333333; 
        }
        .on { 
            background: #ffffff; 
            color: #000000; 
            border: 1px solid #ffffff; 
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        #log { 
            font-size: 11px; 
            color: #555555; 
            text-align: center; 
            margin-top: 20px; 
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NOIR // SYSTEM</h1>
        <div class="card">
            <span class="label">TEMPERATURE</span>
            <span class="value" id="temp">-- °C</span>
        </div>
        <div class="card">
            <span class="label">HUMIDITY</span>
            <span class="value" id="hum">-- %</span>
        </div>
        <div class="card">
            <span class="label">PUMP STATUS</span>
            <span class="value" id="pump" style="font-size: 16px;">--</span>
        </div>
        <div id="statusBox" class="status-box off">STATUS: STANDBY</div>
        <div id="log">Connecting to MQTT...</div>
    </div>

    <script>
        const clientId = "noir_client_" + Math.random().toString(16).substring(2, 8);
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "/mqtt", clientId);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({
            onSuccess: onConnect,
            onFailure: onFailure,
            useSSL: false
        });

        function onConnect() {
            document.getElementById("log").innerText = "Secure line established.";
            client.subscribe("smartsprinkler/sby-7f3a/data");
            client.subscribe("smartsprinkler/sby-7f3a/status");
        }

        function onFailure(message) {
            document.getElementById("log").innerText = "Connection failed: " + message.errorMessage;
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                document.getElementById("log").innerText = "Connection lost: " + responseObject.errorMessage;
            }
        }

        function onMessageArrived(message) {
            let topic = message.destinationName;
            let payload = message.payloadString;

            if (topic === "smartsprinkler/sby-7f3a/data") {
                try {
                    let data = JSON.parse(payload);
                    document.getElementById("temp").innerText = data.temperature.toFixed(1) + " °C";
                    document.getElementById("hum").innerText = data.humidity.toFixed(1) + " %";
                } catch(e) {
                    console.log("JSON parse error");
                }
            } else if (topic === "smartsprinkler/sby-7f3a/status") {
                let box = document.getElementById("statusBox");
                let pumpTxt = document.getElementById("pump");
                if (payload === "ON") {
                    box.className = "status-box on";
                    box.innerText = "WARNING: HEAT DETECTED";
                    pumpTxt.innerText = "ACTIVE";
                } else {
                    box.className = "status-box off";
                    box.innerText = "STATUS: SECURE / NORMAL";
                    pumpTxt.innerText = "STANDBY";
                }
            }
        }
    </script>
</body>
</html>
