<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Sprinkler - Noir Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #080808; 
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.03) 10%, transparent 10%),
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.95));
            background-size: 16px 16px, 100% 100%;
            color: #d1d1d1; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            width: 100%; 
            max-width: 420px; 
            background: #111111; 
            border: 3px solid #2b2b2b; 
            border-radius: 2px; 
            padding: 30px; 
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.9), 0 15px 30px rgba(0, 0, 0, 0.7); 
            position: relative;
        }
        .container::before {
            content: "";
            position: absolute;
            top: -6px; left: -6px;
            right: -6px; bottom: -6px;
            border: 1px dashed #444444;
            pointer-events: none;
        }
        h1 { 
            text-align: center; 
            font-family: 'Special Elite', cursive; 
            font-size: 24px; 
            color: #f2f2f2; 
            margin-bottom: 25px; 
            letter-spacing: 2px;
            border-bottom: 2px solid #333333;
            padding-bottom: 15px;
            text-shadow: 2px 2px 0px #000;
        }
        .card { 
            background: #181818; 
            border: 2px solid #262626; 
            border-radius: 2px; 
            padding: 18px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        .label { 
            font-size: 13px; 
            color: #7d7d7d; 
            font-weight: 600;
            letter-spacing: 1.5px;
        }
        .value { 
            font-size: 22px; 
            font-weight: 600; 
            color: #ffffff; 
            font-family: 'Special Elite', cursive;
        }
        .status-box { 
            text-align: center; 
            padding: 14px; 
            border-radius: 2px; 
            font-weight: 600; 
            font-size: 14px; 
            margin-top: 20px; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
            border: 2px solid #333;
        }
        .off { 
            background: #141414; 
            color: #666666; 
            border-color: #2b2b2b; 
        }
        .on { 
            background: #e6e6e6; 
            color: #000000; 
            border-color: #ffffff; 
            font-weight: 700;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
        #log { 
            font-size: 11px; 
            color: #4a4a4a; 
            text-align: center; 
            margin-top: 20px; 
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NOIR // SYSTEM</h1>
        <div class="card">
            <span class="label">TEMPERATURE</span>
            <span class="value" id="temp">-- °C</span>
        </div>
        <div class="card">
            <span class="label">HUMIDITY</span>
            <span class="value" id="hum">-- %</span>
        </div>
        <div class="card">
            <span class="label">PUMP STATUS</span>
            <span class="value" id="pump" style="font-size: 16px;">--</span>
        </div>
        <div id="statusBox" class="status-box off">STATUS: STANDBY</div>
        <div id="log">Connecting to MQTT...</div>
    </div>

    <script>
        const clientId = "noir_client_" + Math.random().toString(16).substring(2, 8);
        const client = new Paho.MQTT.Client("broker.emqx.io", 8084, "/mqtt", clientId);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({
            onSuccess: onConnect,
            onFailure: onFailure,
            useSSL: true
        });

        function onConnect() {
            document.getElementById("log").innerText = "Secure line established.";
            client.subscribe("smartsprinkler/sby-7f3a/data");
            client.subscribe("smartsprinkler/sby-7f3a/status");
        }

        function onFailure(message) {
            document.getElementById("log").innerText = "Connection failed: " + message.errorMessage;
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                document.getElementById("log").innerText = "Connection lost: " + responseObject.errorMessage;
            }
        }

        function onMessageArrived(message) {
            let topic = message.destinationName;
            let payload = message.payloadString;

            if (topic === "smartsprinkler/sby-7f3a/data") {
                try {
                    let data = JSON.parse(payload);
                    document.getElementById("temp").innerText = data.temperature.toFixed(1) + " °C";
                    document.getElementById("hum").innerText = data.humidity.toFixed(1) + " %";
                    
                    let box = document.getElementById("statusBox");
                    let pumpTxt = document.getElementById("pump");
                    if (data.pump === true) {
                        box.className = "status-box on";
                        box.innerText = "WARNING: HEAT DETECTED";
                        pumpTxt.innerText = "ACTIVE";
                    } else {
                        box.className = "status-box off";
                        box.innerText = "STATUS: SECURE / NORMAL";
                        pumpTxt.innerText = "STANDBY";
                    }
                } catch(e) {
                    console.log("JSON parse error");
                }
            }
        }
    </script>
</body>
</html>
